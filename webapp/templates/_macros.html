{% macro logo() -%}
<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/><path d="M8 30 C15 28 16 15 22 15 S30 26 36 12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/><circle cx="8" cy="30" r="4.6" fill="#77cc09"/><circle cx="22" cy="15" r="3.8" fill="#ffffff"/><circle cx="36" cy="12" r="4.6" fill="#fabc20"/></svg>
{%- endmacro %}

{% macro hero(title, text=None, small=False) -%}
<section class="hero{% if small %} sm{% endif %}" style="--next:#fff">
  <div class="wrap hero-in">
    <h1>{{ title }}</h1>
    {% if text %}<p class="lead">{{ text }}</p>{% endif %}
    {% if caller %}<div class="acts">{{ caller() }}</div>{% endif %}
  </div>
  <svg class="hero-cut" viewBox="0 0 1440 150" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="fondo" points="0,150 1440,40 1440,150"/>
    <g fill="none" stroke="#fabc20" stroke-opacity=".7" stroke-width="1.3"><path d="M1150 150 C1210 112 1320 96 1440 92"/><path d="M1200 150 C1255 120 1340 108 1440 106"/></g>
    <polygon points="960,62.7 1440,26 1440,34 960,70.7" fill="#fff"/>
    <polygon points="880,78.8 1440,36 1440,46 880,88.8" fill="#77cc09"/>
    <polygon points="990,84.4 1440,50 1440,59 990,93.4" fill="#fabc20"/>
  </svg>
</section>
{%- endmacro %}
