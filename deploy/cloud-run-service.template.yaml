apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: geoportal-chcp-private
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: REEMPLAZAR_CUENTA_SERVICIO@geoportal-513817.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 600
      containers:
        - image: REEMPLAZAR_REGION-docker.pkg.dev/geoportal-513817/geoportal/geoportal-chcp:REEMPLAZAR_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GEE_PROJECT_ID
              value: geoportal-513817
            - name: WEB_MAX_REQUEST_BYTES
              value: "1048576"
            - name: WEB_MAX_COORDINATES
              value: "5000"
            - name: WEB_MAX_ANALYSIS_AREA_HA
              value: "345000"
            - name: WEB_MAX_MAP_FEATURES
              value: "1500"
            - name: WEB_RESULT_CACHE_ENTRIES
              value: "4"
            - name: WEB_RESULT_CACHE_TTL
              value: "900"
            - name: WEB_MAX_CONCURRENT_ANALYSES
              value: "1"
            - name: WEB_ANALYSIS_RATE_LIMIT
              value: "4"
            - name: WEB_DOWNLOAD_RATE_LIMIT
              value: "20"
            - name: WEB_RATE_LIMIT_WINDOW_SECONDS
              value: "600"
            - name: WEB_TRUST_PROXY_HEADERS
              value: "1"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 24
            httpGet:
              path: /api/v1/health
              port: 8080
          livenessProbe:
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
            httpGet:
              path: /api/v1/health
              port: 8080
